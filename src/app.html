<!doctype html>
<html lang="fr" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Appito — suivi de la charge d'entraînement : musculation et course." />
		<meta name="theme-color" content="#050507" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Appito" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		<script>
			// Applique le thème avant le premier rendu : pas de flash blanc/noir.
			(function () {
				try {
					var choice = localStorage.getItem('appito-theme') || 'auto';
					var light =
						choice === 'light' ||
						(choice === 'auto' &&
							window.matchMedia('(prefers-color-scheme: light)').matches);
					document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
